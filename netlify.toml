[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Production must configure the public API, Supabase project and publishable key.
# Never publish a build that silently falls back to localhost or exposes server keys.
[context.production]
  command = "node scripts/check-production-env.mjs && npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
