# Disposable demo by default: free instances have no persistent disk.
# For durable data, select a paid plan and attach the configured storage path.
services:
  - type: web
    name: smart-wardrobe-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: WARDROBE_DATA_DIR
        value: /opt/render/project/src/storage
      - key: FRONTEND_ORIGINS
        sync: false
